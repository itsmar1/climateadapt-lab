[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climateadapt-lab"
version = "0.1.0"
description = "ClimateAdapt Lab: evidence-grounded agricultural drought adaptation decision support."
readme = "README.md"
authors = [
    { name = "Marouane Ahal", email = "marouane.ahal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cdsapi>=0.7.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "netcdf4>=1.6",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "rasterio>=1.3.9",
    "scipy>=1.11",
    "uvicorn[standard]>=0.29",
    "xarray>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

dense = [
    "qdrant-client>=1.20",
    "sentence-transformers>=6.2",
]

# CPU-only PyTorch for the dense extra: +cpu builds live on the PyTorch CPU
# index, not PyPI (uv "Using uv with PyTorch" guide). explicit = true keeps
# every other package on PyPI; only torch is sourced from this index. macOS
# is carved out (PyPI fallback): the CPU index ships plain 2.15.0 there, and
# PyTorch publishes no CUDA builds for macOS, so PyPI torch is CPU-only too.
[tool.uv]
constraint-dependencies = [
    "torch==2.15.0+cpu; sys_platform != 'darwin'",
    "torch==2.15.0; sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"climateadapt.recommend" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # rasterio.transform.from_origin (used only to build synthetic test rasters) triggers
    # an internal Affine deprecation notice that is not ours to fix.
    "ignore::PendingDeprecationWarning:rasterio.transform",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]